<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Create Account</h2>
      <p>Sign up to start managing your finances</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group" *ngIf="error">
        <div class="error-message">{{ error }}</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            type="text"
            class="form-input"
            placeholder="First name"
            [(ngModel)]="registerData.name"
            name="name"
          />
        </div>
        <div class="form-group">
          <label for="surname" class="form-label">Surname</label>
          <input
            id="surname"
            type="text"
            class="form-input"
            placeholder="Last name"
            [(ngModel)]="registerData.surname"
            name="surname"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email *</label>
        <input
          id="email"
          type="email"
          class="form-input"
          placeholder="Enter your email"
          [(ngModel)]="registerData.email"
          name="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="occupation" class="form-label">Occupation</label>
        <input
          id="occupation"
          type="text"
          class="form-input"
          placeholder="Your occupation"
          [(ngModel)]="registerData.occupation"
          name="occupation"
        />
      </div>

      <div class="form-group">
        <label for="monthly_income" class="form-label">Monthly Income</label>
        <input
          id="monthly_income"
          type="number"
          class="form-input"
          placeholder="0.00"
          [(ngModel)]="registerData.monthly_income"
          name="monthly_income"
          step="0.01"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password *</label>
        <input
          id="password"
          type="password"
          class="form-input"
          placeholder="Enter your password"
          [(ngModel)]="registerData.password"
          name="password"
          required
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password *</label>
        <input
          id="confirm_password"
          type="password"
          class="form-input"
          placeholder="Confirm your password"
          [(ngModel)]="registerData.confirm_password"
          name="confirm_password"
          required
          autocomplete="new-password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Creating account...</span>
      </button>
    </form>

    <div class="login-link">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
