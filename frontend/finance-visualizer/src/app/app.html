<div class="app-container" *ngIf="!isLoginPage(); else loginPage">
  <nav class="sidebar">
    <div class="sidebar-header">
      <h2>💰 FinanceViz</h2>
    </div>
    <ul class="nav-menu">
      <li class="nav-item">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/transactions" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">💳</span>
          <span>Transactions</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/categories" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📈</span>
          <span>Categories</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/trends" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📉</span>
          <span>Trends</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/alerts" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">🚨</span>
          <span>Alerts</span>
        </a>
      </li>
    </ul>
  </nav>
  
  <main class="main-content">
    <header class="top-header">
      <div class="header-content">
        <h1>{{ title() }}</h1>
        <div class="user-info">
          <span>Welcome back, {{ currentUserEmail }}!</span>
          <button class="btn btn-secondary" (click)="logout()">Logout</button>
        </div>
      </div>
    </header>
    
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<ng-template #loginPage>
  <router-outlet></router-outlet>
</ng-template>
